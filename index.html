<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zohair Tracker</title>

<style>
body{
background:#0f172a;
color:white;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
padding:20px;
margin:0;
}

.card{
background:#1e293b;
padding:16px;
border-radius:20px;
margin-bottom:16px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
margin-top:8px;
font-size:16px;
font-weight:600;
background:#22c55e;
color:white;
}

.prayer{
width:48%;
display:inline-block;
margin-bottom:8px;
}

input{
width:100%;
padding:12px;
border-radius:12px;
border:none;
font-size:16px;
}

h1{
margin-top:0;
}

.xp{
font-size:32px;
font-weight:bold;
color:#22c55e;
}
</style>
</head>

<body>

<h1>Zohair Tracker</h1>

<div class="card">
<div>Level</div>
<h2 id="level">1</h2>

<div>XP</div>
<div class="xp" id="xp">0</div>
</div>

<div class="card">
<h3>Tasks</h3>

<div id="taskCount">0 Tasks Completed Today</div>

<button onclick="completeTask()">
Complete Task (+25 XP)
</button>
</div>

<div class="card">
<h3>Namaz</h3>

<button class="prayer" onclick="pray('fajr')">Fajr</button>
<button class="prayer" onclick="pray('dhuhr')">Dhuhr</button>
<button class="prayer" onclick="pray('asr')">Asr</button>
<button class="prayer" onclick="pray('maghrib')">Maghrib</button>
<button class="prayer" onclick="pray('isha')">Isha</button>

<p id="namazCount">0 / 5 Complete</p>
</div>

<div class="card">
<h3>Reading</h3>

<input id="pages" type="number" placeholder="Pages read today">

<button onclick="saveReading()">
Save Reading (+10 XP)
</button>

<p id="readingDisplay">0 Pages</p>
</div>

<script>

let xp = Number(localStorage.getItem("xp")) || 0;
let tasks = Number(localStorage.getItem("tasks")) || 0;
let pages = Number(localStorage.getItem("pages")) || 0;

let prayers =
JSON.parse(localStorage.getItem("prayers"))
||
{
fajr:false,
dhuhr:false,
asr:false,
maghrib:false,
isha:false
};

function save(){
localStorage.setItem("xp",xp);
localStorage.setItem("tasks",tasks);
localStorage.setItem("pages",pages);
localStorage.setItem("prayers",JSON.stringify(prayers));
render();
}

function level(){
return Math.floor(xp/100)+1;
}

function render(){

document.getElementById("xp").innerText=xp;
document.getElementById("level").innerText=level();

document.getElementById("taskCount").innerText=
tasks+" Tasks Completed Today";

document.getElementById("readingDisplay").innerText=
pages+" Pages";

let count=
Object.values(prayers).filter(x=>x).length;

document.getElementById("namazCount").innerText=
count+" / 5 Complete";
}

function completeTask(){
tasks++;
xp+=25;
save();
}

function pray(name){

if(!prayers[name]){
prayers[name]=true;
xp+=15;
save();
}
}

function saveReading(){

let value=
Number(document.getElementById("pages").value);

if(!value) return;

pages=value;
xp+=10;

save();
}

render();

</script>

</body>
</html>
