<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zohair Tracker</title>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

.card{
background:#1e293b;
padding:16px;
border-radius:20px;
margin-bottom:16px;
}

.title{
font-size:32px;
font-weight:700;
margin-bottom:8px;
}

.xp{
font-size:20px;
color:#22c55e;
}

.progress{
height:12px;
background:#334155;
border-radius:999px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:72%;
background:#22c55e;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#22c55e;
color:white;
font-size:16px;
font-weight:600;
}

.small{
opacity:.7;
font-size:14px;
}
</style>
</head>

<body>

<div class="title">Zohair Tracker</div>

<div class="card">
<div class="small">Level 3</div>
<div class="xp">1,250 XP</div>

<div class="progress">
<div class="fill"></div>
</div>
</div>

<div class="card">
<h3>Today's Score</h3>
<p>72%</p>
</div>

<div class="card">
<h3>Namaz</h3>
<p>4 / 5 Completed</p>
</div>

<div class="card">
<h3>Reading</h3>
<p>18 Pages Today</p>
</div>

<div class="card">
<h3>Objectives</h3>
<p>Build Zohair Tracker</p>
<p>ADHD Learning</p>
<p>Padel Improvement</p>
</div>

<button>
Complete Task (+25 XP)
</button>

</body>
</html>
